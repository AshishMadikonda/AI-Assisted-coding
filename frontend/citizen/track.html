<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Report</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f1ea;
      color: #20291f;
    }
    main { max-width: 560px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .sub { margin: 0 0 24px; color: #5c6656; }
    form, #card {
      background: #fff;
      border: 1px solid #d9d3c2;
      border-radius: 10px;
      padding: 22px;
    }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #c9bfa3;
      border-radius: 6px;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #2f6e5b;
      color: #fff;
    }
    #message { min-height: 20px; margin: 14px 0; font-weight: 600; color: #a8412b; }
    #card { margin-top: 4px; }
    #card h2 { margin: 0 0 16px; font-size: 20px; }
    .steps { list-style: none; margin: 0 0 18px; padding: 0; }
    .steps li {
      padding: 10px 12px 10px 38px;
      margin-bottom: 8px;
      border-radius: 6px;
      background: #f0ece0;
      color: #8a8f84;
      position: relative;
    }
    .steps li::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 50%;
      width: 14px;
      height: 14px;
      margin-top: -7px;
      border-radius: 50%;
      border: 2px solid #c9bfa3;
    }
    .steps li.done { background: #dcebe5; color: #1f4b3e; font-weight: 600; }
    .steps li.done::before { background: #2f6e5b; border-color: #2f6e5b; }
    dl { margin: 0; }
    dt { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #5c6656; margin-top: 12px; }
    dd { margin: 2px 0 0; }
    .back { display: block; margin-top: 22px; color: #2f6e5b; }
  </style>
</head>
<body>
  <main>
    <h1>Track Your Report</h1>
    <p class="sub">Enter your issue number to see where it stands.</p>

    <form id="trackForm">
      <label for="issueId">Issue number</label>
      <input type="number" id="issueId" min="1" placeholder="For example 1" required>
      <button type="submit">Check status</button>
    </form>

    <p id="message"></p>

    <section id="card" hidden>
      <h2 id="cardTitle"></h2>
      <ul class="steps">
        <li id="step-reported">Reported</li>
        <li id="step-assigned">Assigned to a worker</li>
        <li id="step-resolved">Resolved</li>
      </ul>
      <dl>
        <dt>Department</dt><dd id="department"></dd>
        <dt>Urgency</dt><dd id="urgency"></dd>
        <dt>Description</dt><dd id="description"></dd>
        <dt>Reported on</dt><dd id="reportedOn"></dd>
      </dl>
    </section>

    <a class="back" href="index.html">Report a new issue</a>
  </main>

  <script>
    const API = "http://127.0.0.1:8000";
    const ORDER = ["reported", "assigned", "resolved"];
    const CATEGORY_LABELS = {
      road_damage: "Road damage",
      water_drainage: "Water and drainage",
      electricity: "Electricity",
      sanitation: "Sanitation",
      mosquito_breeding: "Mosquito breeding",
      streetlight: "Streetlight",
    };

    const form = document.getElementById("trackForm");
    const message = document.getElementById("message");
    const card = document.getElementById("card");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = document.getElementById("issueId").value;
      message.textContent = "Checking...";
      card.hidden = true;

      try {
        const response = await fetch(API + "/issues/" + id);
        if (response.status === 404) {
          message.textContent = "No issue found with that number.";
          return;
        }
        if (!response.ok) throw new Error("request failed");
        const issue = await response.json();

        document.getElementById("cardTitle").textContent =
          "#" + issue.id + " - " + (CATEGORY_LABELS[issue.category] || issue.category);
        document.getElementById("department").textContent = issue.department;
        document.getElementById("urgency").textContent = issue.urgency;
        document.getElementById("description").textContent = issue.description || "-";
        document.getElementById("reportedOn").textContent =
          new Date(issue.created_at).toLocaleString();

        const current = ORDER.indexOf(issue.status);
        ORDER.forEach((status, index) => {
          document
            .getElementById("step-" + status)
            .classList.toggle("done", index <= current);
        });

        message.textContent = "";
        card.hidden = false;
      } catch (error) {
        message.textContent = "Could not check the status. Check that the backend is running.";
      }
    });
  </script>
</body>
</html>
