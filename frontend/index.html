<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report a Civic Issue</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f1ea;
      color: #20291f;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .sub { margin: 0 0 24px; color: #5c6656; }
    form {
      background: #fff;
      border: 1px solid #d9d3c2;
      border-radius: 10px;
      padding: 22px;
    }
    label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 14px; }
    label:first-of-type { margin-top: 0; }
    input[type="file"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #c9bfa3;
      border-radius: 6px;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 80px; resize: vertical; }
    #preview {
      display: none;
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 10px;
    }
    .note { margin: 8px 0 0; font-size: 13px; color: #2f6e5b; min-height: 18px; }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      padding: 11px 18px;
      border: none;
    }
    #locBtn { background: #e4dcc8; color: #20291f; }
    #submitBtn {
      width: 100%;
      margin-top: 22px;
      background: #2f6e5b;
      color: #fff;
      font-weight: 600;
    }
    #submitBtn:disabled { opacity: 0.6; cursor: not-allowed; }
    #result { margin-top: 18px; font-weight: 600; color: #1f4b3e; }
    #result.error { color: #a8412b; }
  </style>
</head>
<body>
  <main>
    <h1>Report a Civic Issue</h1>
    <p class="sub">Take a photo. We identify the problem and send it to the right department.</p>

    <form id="reportForm">
      <label for="photo">Photo</label>
      <input type="file" id="photo" accept="image/jpeg,image/png" required>
      <img id="preview" alt="Preview of your photo">
      <p class="note" id="aiStatus"></p>

      <label for="category">Issue type</label>
      <select id="category" required>
        <option value="" disabled selected>Choose a type</option>
        <option value="road_damage">Road damage</option>
        <option value="water_drainage">Water and drainage</option>
        <option value="electricity">Electricity</option>
        <option value="sanitation">Sanitation</option>
        <option value="mosquito_breeding">Mosquito breeding</option>
        <option value="streetlight">Streetlight</option>
      </select>

      <label for="urgency">Urgency</label>
      <select id="urgency">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>

      <label for="description">Description</label>
      <textarea id="description" placeholder="Describe the problem"></textarea>

      <label>Location</label>
      <button type="button" id="locBtn">Use my location</button>
      <p class="note" id="locStatus"></p>

      <button type="submit" id="submitBtn">Submit report</button>
    </form>

    <p id="result"></p>
  </main>

  <script>
    const API = "http://127.0.0.1:8000";

    const form = document.getElementById("reportForm");
    const photoInput = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const aiStatus = document.getElementById("aiStatus");
    const categorySelect = document.getElementById("category");
    const urgencySelect = document.getElementById("urgency");
    const descriptionBox = document.getElementById("description");
    const locBtn = document.getElementById("locBtn");
    const locStatus = document.getElementById("locStatus");
    const submitBtn = document.getElementById("submitBtn");
    const result = document.getElementById("result");

    let latitude = null;
    let longitude = null;

    // 1. When a photo is chosen: show it, then ask the AI to classify it
    photoInput.addEventListener("change", async () => {
      const file = photoInput.files[0];
      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      aiStatus.textContent = "Analysing your photo with AI...";

      const data = new FormData();
      data.append("photo", file);

      try {
        const response = await fetch(API + "/classify", { method: "POST", body: data });
        if (!response.ok) throw new Error("classify failed");
        const ai = await response.json();

        if (ai.category && ai.category !== "unknown") {
          categorySelect.value = ai.category;
          aiStatus.textContent = "AI suggestion filled in below. You can change it.";
        } else {
          categorySelect.value = "";
          aiStatus.textContent = "AI could not identify the problem. Please choose the type yourself.";
        }
        urgencySelect.value = ai.urgency || "medium";
        if (!descriptionBox.value) descriptionBox.value = ai.description || "";
      } catch (error) {
        aiStatus.textContent = "AI is unavailable right now. Please choose the type yourself.";
      }
    });

    // 2. Capture the user's location
    locBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        locStatus.textContent = "Location is not supported in this browser.";
        return;
      }
      locStatus.textContent = "Getting your location...";
      navigator.geolocation.getCurrentPosition(
        (position) => {
          latitude = position.coords.latitude;
          longitude = position.coords.longitude;
          locStatus.textContent =
            "Location captured (" + latitude.toFixed(4) + ", " + longitude.toFixed(4) + ")";
        },
        () => {
          locStatus.textContent = "Could not get your location. You can still submit.";
        }
      );
    });

    // 3. Submit the report to the backend
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      result.className = "";
      result.textContent = "Submitting...";

      try {
        const response = await fetch(API + "/issues", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            category: categorySelect.value,
            description: descriptionBox.value,
            urgency: urgencySelect.value,
            latitude: latitude,
            longitude: longitude,
          }),
        });
        if (!response.ok) throw new Error("submit failed");
        const data = await response.json();

        result.textContent = "Report submitted. Your issue number is #" + data.id + ".";
        form.reset();
        preview.style.display = "none";
        aiStatus.textContent = "";
        locStatus.textContent = "";
        latitude = null;
        longitude = null;
      } catch (error) {
        result.className = "error";
        result.textContent = "Could not submit. Check that the backend is running.";
      }
      submitBtn.disabled = false;
    });
  </script>
</body>
</html>
